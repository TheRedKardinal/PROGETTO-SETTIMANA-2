<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Homepage — Week Project</title>
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
</head>

<body>

    <header>
        <!-- Logo, barra di ricerca, link Account / Ordini / Carrello -->
        <nav id="mainMenu">
            <ul>
                <li>
                    <a  id="logo" href="javascript:void()" target="_blank"></a>
                </li>
                <li>
                    <form id="searchBar" action="/search" method="get">
                        <label for="searchBar"></label>
                        <input type="search" placeholder="Cerca prodotti, categorie, brand..." /><button
                            type="submit">Cerca</button>
                    </form>
                </li>
                <li>
                    <a href="javascript:void()" target="_blank">Account</a>
                </li>
                <li>
                    <a href="javascript:void()" target="_blank">Ordini</a>
                </li>
                <li>
                    <button id="carrello">Carrello (0)</button>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="hero">
            <!-- Titolo grande, sottotitolo -->
            <h1>Le offerte di oggi</h1>
            <p>Sconti fino al 70% su elettronica, libri, casa e molto altro</p>
        </section>

        <section class="categorie">
            <!-- 4 card categoria -->
             <h2>Categorie</h2>
             <div class="categoryCard">

             </div>
        </section>

        <section class="prodotti">
            <!-- Griglia prodotti (Versione Base: HTML statico; Intermedia/Avanzata: generata da JS) -->
        </section>

    </main>

    <footer>
        <!-- 3 colonne di link -->
    </footer>

    <script src="assets/js/script.js"></script>
</body>

</html>
